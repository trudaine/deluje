name: Unit Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          java-version: '27-ea'
          distribution: 'temurin'
          cache: maven
          server-id: github

      # The Swing UI tests need a display; GitHub runners have none (issue #20).
      - name: Run JVM tests
        run: xvfb-run --auto-servernum mvn test -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
